[package]
name = "promin"
description = "Read-only local monitor for Deye solar inverters: polls the logger on your network, stores every sample, serves it over HTTP"
keywords = ["deye", "solarman", "inverter", "solar", "modbus"]
categories = ["command-line-utilities", "hardware-support"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
promin-core.workspace = true
